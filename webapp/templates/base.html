<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Review Intelligence{% endblock %} · Indian E-commerce</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="/"><span class="logo">RI</span> Review Intelligence <small>Indian E-commerce</small></a>
      <nav>
        <a href="/" class="{{ 'on' if request.path == '/' }}">Analyzer</a>
        <a href="/dashboard" class="{{ 'on' if request.path == '/dashboard' }}">Dashboard</a>
        <a href="/model" class="{{ 'on' if request.path == '/model' }}">Model &amp; Experiments</a>
      </nav>
    </div>
  </header>
  <main class="wrap">{% block body %}{% endblock %}</main>
  <footer class="wrap foot">M.Tech AI-ML · LCA1 · Neural network built from scratch in NumPy (perceptron → MLP → back-propagation) · Served with Flask on Google Cloud Run</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
